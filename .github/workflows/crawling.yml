name: Daily Naver Place Crawler

on:
  schedule:
    # 매일 한국시간 새벽 3시 실행 (UTC 기준 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 수동으로 실행 버튼 누를 수 있게 허용

jobs:
  crawl:
    runs-on: ubuntu-latest

  steps:
      - name: Check out code
        uses: actions/checkout@v4  # v3 -> v4 변경

      - name: Set up Python
        uses: actions/setup-python@v5  # v4 -> v5 변경
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python main.py
