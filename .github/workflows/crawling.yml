name: Daily Naver Place Crawler

on:
  schedule:
    # 💡 [핵심 절감 1] 실행 횟수 축소
    # 하루 6회 -> 하루 1회 실행 (KST 오전 09:30 실행 / UTC 00:30)
    # 하루 2회 로 수정함 ::필요시 하루 2회(예: '30 0,12 * * *') 등으로 조절하세요.
    - cron: cron: '30 0,12 * * *' 
  workflow_dispatch:

# 💡 [핵심 절감 2] 중복 실행 자동 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'
          # 💡 [핵심 절감 3] pip 패키지 캐싱 적용
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 💡 [핵심 절감 4] Playwright 브라우저 binaries 캐싱
      # 매번 100~200MB가 넘는 chromium을 다운로드하는 시간을 없애줍니다.
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Playwright System Dependencies
        run: playwright install-deps chromium

      - name: Run Crawler
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python -u main.py
